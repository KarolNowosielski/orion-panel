<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c30"><title>Orion Panel — projektant rozdzielni</title><link rel="stylesheet" href="style.css"></head>
<body><aside class="sidebar"><a class="brand" href="#" aria-label="Orion Panel — strona główna"><img class="brand-logo" src="assets/orion-panel-logo.png" alt="Orion Panel — inteligentny dom" width="1254" height="1254"></a><div class="workspace-label">PRZESTRZEŃ PROJEKTOWA</div><nav id="nav"><button data-view="overview" class="active"><span>◫</span> Przegląd projektu</button><button data-view="circuits"><span>⌁</span> Obwody <b id="nav-count">0</b></button><button data-view="modules"><span>▤</span> Moduły i kanały</button><button data-view="protection"><span>⊞</span> Zabezpieczenia</button><button data-view="terminals"><span>⊟</span> Listwa zaciskowa</button><button data-view="pdf"><span>▧</span> Import projektu PDF</button></nav><div class="side-bottom"><span class="online-dot"></span> Wszystko na Twoim urządzeniu<p>Projektuj z dobrym połączeniem.</p><small>ORION PANEL &nbsp; / &nbsp; v1.0</small></div></aside>
<div class="app"><header class="topbar"><div class="breadcrumb">Projekty <span>/</span> <strong id="project-crumb"></strong></div><div class="top-actions"><span id="save-state" class="save-state">● Zapisano lokalnie</span><button class="btn" id="load-project">↥ Otwórz</button><button class="btn" id="save-project">↓ Zapisz projekt</button><button class="avatar" aria-label="Aplikacja lokalna">OP</button></div></header><main id="main"></main><footer>ORION PANEL <span>Plan koncepcyjny · Dobór aparatów, przekrojów i ochrony wymaga weryfikacji projektanta instalacji.</span><span>LOCAL FIRST ↗</span></footer></div>

<input type="file" id="json-file" accept="application/json,.json" hidden><input type="file" id="pdf-file" accept="application/pdf,.pdf" hidden><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
